[project]
name = "affmeasure"
version = "0.1.0"
description = "Affiliate measurement stack for iGaming: contracts, contribution margin, incrementality, LTV, fraud scoring, reconciliation (synthetic demo data)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikolay Chekotko" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
]

[project.scripts]
affmeasure = "affmeasure.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affmeasure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
